<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Anti Blokir</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent !important;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="overlayVideo">
        <source src="https://www.dropbox.com/scl/fi/7za69at9lebekyj6gyhc5/lv_0_20260919103406.mp4?rlkey=45hp6337616kuve71huo8gsw6&st=f15ql5m2&dl=1" type="video/mp4">
    </video>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('overlayVideo');
            video.muted = true; // Wajib bisu agar HP mengizinkan putar otomatis
            
            // Memaksa video berputar
            const playVideo = () => {
                video.play().catch(err => {
                    console.log("Mencoba memutar ulang...");
                    setTimeout(playVideo, 1000);
                });
            };
            playVideo();
        });
    </script>
</body>
</html>
