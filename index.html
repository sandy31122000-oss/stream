<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent !important; /* Memaksa latar belakang transparan */
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Menjaga rasio video overlay Anda */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- PASTIKAN LINK DI BAWAH INI ADALAH LINK DIRECT VIDEO (BERAKHIRAN .MP4 ATAU .WEBM) -->
    <video autoplay loop muted playsinline id="overlayVideo">
        <source src="https://www.dropbox.com/scl/fi/7za69at9lebekyj6gyhc5/lv_0_20260919103406.mp4?rlkey=45hp6337616kuve71huo8gsw6&st=f15ql5m2&dl=1" type="video/mp4">
    </video>

    <script>
        // Memaksa video berputar jika browser memblokir autoplay otomatis
        document.addEventListener("DOMContentLoaded", function() {
            var video = document.getElementById("overlayVideo");
            video.play().catch(function(error) {
                console.log("Autoplay dicegah oleh browser, mencoba memutar ulang...", error);
            });
        });
    </script>
</body>
</html>
