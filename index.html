<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Permanen</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent !important;
        }
        /* Menggunakan trik objek penutup penuh tanpa tag video */
        #canvasOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Kode video yang dipaksa berjalan di latar belakang sistem -->
    <video autoplay loop muted playsinline id="canvasOverlay" poster="" style="object-fit: contain;">
        <source src="https://www.dropbox.com/scl/fi/7za69at9lebekyj6gyhc5/lv_0_20260919103406.mp4?rlkey=45hp6337616kuve71huo8gsw6&st=f15ql5m2&dl=1" type="video/mp4">
    </video>

    <script>
        // Trik memicu simulasi interaksi agar HP melepas sensor tombol play
        function forceStart() {
            const v = document.getElementById('canvasOverlay');
            v.play();
            v.muted = true;
        }
        window.addEventListener('DOMContentLoaded', forceStart);
        window.addEventListener('load', forceStart);
        document.addEventListener('touchstart', forceStart);
    </script>
</body>
</html>
